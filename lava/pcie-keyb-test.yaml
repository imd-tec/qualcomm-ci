device_type: ssh
job_name: PCIe Key-B overlay test on imdt-8550-sbc
tags:
- dut-ssh

timeouts:
  job:
    minutes: 15
  action:
    minutes: 10
  connection:
    minutes: 5
priority: medium
visibility: public

actions:
- deploy:
    to: ssh
    os: oe
    timeout:
      minutes: 5

- boot:
    method: ssh
    prompts:
    - 'root@'
    timeout:
      minutes: 5

- test:
    timeout:
      minutes: 10
    definitions:
    - from: inline
      name: pcie-keyb
      path: inline/pcie-keyb.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: pcie-keyb
          description: Verify PCIe switch is routed to M.2 Key-B slot (LAN7430 absent, PCIe1 up)
        run:
          steps:
          # Confirm the pcie-keyb DTB is active by checking the DT model or
          # falling back to the PCIe bus state.
          - DTB_MODEL=$(cat /proc/device-tree/model 2>/dev/null || true)
          - 'echo "DTB model: $DTB_MODEL"'
          - lava-test-case dtb-readable --shell test -n "$DTB_MODEL"

          # PCIe1 root complex (domain 0001:) must enumerate — the link may
          # not train if no Key-B card is inserted, but the root port itself
          # should always appear once pcie1 probes successfully.
          - PCIE1_RC=$(lspci -n 2>/dev/null | grep '^0001:00:00' || true)
          - 'echo "PCIe1 root complex: ${PCIE1_RC:-not found}"'
          - if [ -n "$PCIE1_RC" ]; then lava-test-case pcie1-root-complex --result pass; else lava-test-case pcie1-root-complex --result fail; fi

          # LAN7430 (Microchip 1055:7430) must NOT be present — its absence
          # confirms the PCIe switch has selected the Key-B path.
          - LAN7430=$(lspci -n 2>/dev/null | grep '1055:7430' || true)
          - 'echo "LAN7430 on PCIe bus: ${LAN7430:-absent (expected)}"'
          # NB: no ": " inside unquoted steps — YAML would parse the step as
          # a mapping and LAVA aborts the whole suite at run time.
          - if [ -z "$LAN7430" ]; then lava-test-case no-lan7430 --result pass; else echo "FAIL - LAN7430 found, Key-B overlay not active"; lava-test-case no-lan7430 --result fail; fi

          # The lan743x driver must not have bound to any PCI device.
          - LAN743X_BOUND=$(ls /sys/bus/pci/drivers/lan743x/ 2>/dev/null | grep -v 'bind\|unbind\|new_id\|remove_id\|uevent\|module' || true)
          - 'echo "lan743x bound devices: ${LAN743X_BOUND:-none (expected)}"'
          - if [ -z "$LAN743X_BOUND" ]; then lava-test-case no-lan743x-driver --result pass; else lava-test-case no-lan743x-driver --result fail; fi

          # Report any device that enumerated on pcie1 downstream (informational).
          - M2_DEV=$(lspci 2>/dev/null | grep '^0001:01' || true)
          - 'echo "M.2 Key-B device (if inserted): ${M2_DEV:-none}"'
          - lava-test-case pcie-keyb-complete --result pass
