#Reusable workflow triggerd by workflow_call from external manifest repo
name: Build IMDT QCOM BSP 

defaults:
  run:
    shell: bash -ueo pipefail {0}

on:
  #only triggered on external workflow call
  workflow_call:
      inputs:
        MANIFEST_REPOSITORY:
          required: true
          description: Manifest repository URL
          type: string            

        MANIFEST_BRANCH:
          required: true
          description: Branch of manifest in repository
          type: string   

        MANIFEST_XML:
          required: true
          description: Path to the manifest XML file in branch 
          type: string

        BUILD_NAME:
          required: true
          description: Name of the build (e.g. imsu_glasses_bsp-v1.0.0)
          type: string
        
        BUILD_VERSION:
          required: true
          description: Version of the manifest (e.g. 1.0.0)
          type: string     

        BUILD_KERNEL_VARIANT:
          required: true
          description: Kernel variant to use (e.g. gki-kernel)
          type: string

        BUILD_MACHINE:
          required: true
          description: Target hardware machine (e.g. imdt-qcs8550-sbc)
          type: string      

        BUILD_DISTRO:
          required: true
          description: Build distribution (e.g. imdt-distro-debug)
          type: string

        BUILD_IMAGE:
          required: true
          description: Target image to build (e.g. imdt-image-weston)
          type: string      

        BASE_DOCKER_IMAGE:
          required: true
          description: Docker base image to use (e.g. imdtec/imdt-qualcomm-build-setup:0.5.1)
          type: string

        IMDT_PATCH_SCRIPT_PATH:
          required: true
          description: Path to IMDT patch build script (e.g. LE.PRODUCT.2.1.r1/apps_proc/imdt-patch-qcs8550-build.sh)
          type: string

        BUILD_RELEASE_NAME:
          required: true
          description: Release artifact name (e.g. imsu_glasses_prebuilt_release)
          type: string     
        
        PYENV:
          required: true
          description: Python environment version to use (e.g. 3.8.16)
          type: string
          default: "3.8.16"

        QCS_SOURCES:
          required: true
          description: Qualcomm source files to use (e.g. qcs8550-le-1-0_amss_standard_oem_apqgps-r00087.1)
          type: string

        SKIP_STEPS:
          required: false
          description: Build steps to skip, defined by 'contains' conditionals below (e.g. [sync_repos, build_hlos])
          type: string

        DEV_STATE_LOG:
          required: false
          description: Development build details for logging purposes (see $CI_DEV_DIR/state)
          type: string

        BUILD_SWU:
          required: false
          description: Generate SWUpdate update image
          type: boolean
          default: false
          
        PRESERVE_BUILD_DIR:
          required: false
          description: Preserve build files after build completion
          type: boolean
          default: false

        PRESERVE_DOCKER:
          required: false
          description: Whether to preserve docker container and image after build completion
          type: boolean
          default: false

        JOB_TIMEOUT:
          required: false
          description: Timeout for the build job in minutes 
          type: number
          default: 720 # 12 hours

env:
  CONTAINER_NAME: "ci_qualcomm_${{ github.run_id }}"
  DOCKER_EXEC: docker exec -t -u dev
  
jobs:
  build-qualcomm-bsp:
    #specify labels to run on qcom desktop
    runs-on: [self-hosted, linux, x64, qcom]
    timeout-minutes: ${{ inputs.JOB_TIMEOUT }}
    env:
      MANIFEST_REPOSITORY: ${{ inputs.MANIFEST_REPOSITORY }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      MANIFEST_XML: ${{ inputs.MANIFEST_XML }}
      BUILD_NAME: ${{ inputs.BUILD_NAME }}
      BUILD_VERSION: ${{ inputs.BUILD_VERSION }}
      KERNEL_VARIANT: ${{ inputs.BUILD_KERNEL_VARIANT }}
      MACHINE: ${{ inputs.BUILD_MACHINE }}
      DISTRO: ${{ inputs.BUILD_DISTRO }}
      IMAGE: ${{ inputs.BUILD_IMAGE }}
      BASE_DOCKER_IMAGE: ${{ inputs.BASE_DOCKER_IMAGE }}
      IMDT_PATCH_SCRIPT_PATH: ${{ inputs.IMDT_PATCH_SCRIPT_PATH }}
      RELEASE_NAME: ${{ inputs.BUILD_RELEASE_NAME }}
      PYENV: ${{ inputs.PYENV }}
      QCS_SOURCES: ${{ inputs.QCS_SOURCES }}
      SKIP_STEPS: ${{ inputs.SKIP_STEPS }}
      DEV_STATE_LOG: ${{ inputs.DEV_STATE_LOG }}

    steps:      
      - name: Set repository workspace
        #explicitly checkout into the CI repository. Required if triggered from external repo.
        uses: actions/checkout@v6
        with:
            repository: imd-tec/qualcomm-ci
            ref: stable
            token: ${{ secrets.QCI_DEPLOY_PAT }}
            persist-credentials: false
            path: qualcomm_ci
          
      - name: Verify service environment variables
        run: |
          ERROR="ERROR: Service variable/s not set. Daemon reload and service restart required?"
          echo "CI_DIR: ${CI_DIR:?${ERROR}}"
          echo "CI_DEV_DIR: ${CI_DEV_DIR:?${ERROR}}"
          echo "BSP_SOURCES_DIR: ${BSP_SOURCES_DIR:?${ERROR}}"
          echo "DL_DIR: ${DL_DIR:?${ERROR}}"
          echo "SSTATE_DIR: ${SSTATE_DIR:?${ERROR}}"

      - name: Create build project directory
        run: | 
          #set build project path
          BUILD_PROJECT_DIR="${CI_DIR}/builds/${BUILD_NAME}"

          #export to GITHUB_ENV for later steps
          echo "BUILD_PROJECT_DIR=${BUILD_PROJECT_DIR}" >> $GITHUB_ENV

          #create and change to build project directory
          echo "Using project path: ${BUILD_PROJECT_DIR}"
          mkdir -p "${BUILD_PROJECT_DIR}" && cd "${BUILD_PROJECT_DIR}"

      - name: Extract build sources files into build directory
        if: ${{ !contains(env.SKIP_STEPS, 'extract_sources') }}
        working-directory: ${{ github.workspace }}/qualcomm_ci/scripts
        run: bash extract-sources.sh
 
      - name: Create Docker image, build container and initialize user permissions & ownership
        working-directory: ${{ github.workspace }}/qualcomm_ci/scripts
        run: bash create-docker-build-env.sh

      - name: Patch and synchronize repos
        if: ${{ !contains(env.SKIP_STEPS, 'sync_repos') }}
        run: |
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          if [ -d "/home/dev/Qualcomm/patches" ]; then
            PATCHFILE="/home/dev/Qualcomm/patches/sync_snap_v2_remove_chipcode_copy.patch"
            TARGET="${QCOM_ROOT_DIR}/LE.PRODUCT.2.1.r1/apps_proc/sync_snap_v2.sh"
            #batch to bypass user prompts
            patch --batch "$TARGET" "$PATCHFILE" 
          fi

          #sync repos
          bash /home/dev/build_scripts/sync_repos.sh -u "$MANIFEST_REPOSITORY" -b "$MANIFEST_BRANCH" -m "$MANIFEST_XML" '

      - name: Configure kernel directories
        if: ${{ !contains(env.SKIP_STEPS, 'conf_kernel') }}
        run: |
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          bash /home/dev/build_scripts/setup_kernel.sh '

      - name: Apply IMDT patches to Qualcomm source
        if: ${{ !contains(env.SKIP_STEPS, 'apply_patches') }}
        run: | 
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          bash "${QCOM_ROOT_DIR}/${IMDT_PATCH_SCRIPT_PATH}" '
      
      - name: Configure contents.xml
        if: ${{ !contains(env.SKIP_STEPS, 'conf_contents') }}
        run: |
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          python3 /home/dev/build_scripts/configure_contents_xml.py -d "${DISTRO}" -m "${MACHINE}" -i "${IMAGE}" -x "${QCOM_ROOT_DIR}/contents.xml" ' 

      - name: Build kernel
        if: ${{ !contains(env.SKIP_STEPS, 'build_kernel') }}
        run: |
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          bash /home/dev/build_scripts/build_kernel.sh \
          --lto "thin" --jobs 8 \
          --build_variant "${KERNEL_VARIANT}" \
          --build_output_dir "../out/msm-kernel-kalama_le-${KERNEL_VARIANT}" '
      
      - name: Copy additional HLOS files
        if: ${{ !contains(env.SKIP_STEPS, 'copy_hlos_files') }}
        run: |
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          cd "${QCOM_ROOT_DIR}/LE.PRODUCT.2.1.r1/apps_proc/poky"
          cp -rn "${QCOM_ROOT_DIR}/LE.FRAMEWORK.2.0.r1/apps_proc/poky/"* \
                  "${QCOM_ROOT_DIR}/LE.PRODUCT.2.1.r1/apps_proc/poky/"

          cp -rn "${QCOM_ROOT_DIR}/LE.FRAMEWORK.2.0.r1/apps_proc/src/"* \
                  "${QCOM_ROOT_DIR}/LE.PRODUCT.2.1.r1/apps_proc/src/" '

      - name: Bitbake fetch sources
        if: ${{ !contains(env.SKIP_STEPS, 'bitbake_fetch') }}
        run: |
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          #set Yocto environment
          source /home/dev/tools/container_scripts/setup-yocto-environment.sh
          bitbake "${IMAGE}" --runall=fetch '

      - name: Bitbake build image
        if: ${{ !contains(env.SKIP_STEPS, 'bitbake_build') }}
        run: |
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          #set Yocto environment
          source /home/dev/tools/container_scripts/setup-yocto-environment.sh
          
          #build image
          bitbake "${IMAGE}" '

      - name: Generate SWUpdate image
        if: ${{ inputs.BUILD_SWU }}
        run: |
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          bash /home/dev/tools/container_scripts/generate-swu.sh'

      - name: Generate Yocto SDK
        if: ${{ !contains(env.SKIP_STEPS, 'build_sdk') }}
        continue-on-error: true
        run: |
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          bash /home/dev/tools/container_scripts/generate-sdk.sh '
      
      - name: Build non-HLOS components
        id: build_hlos
        if: ${{ !contains(env.SKIP_STEPS, 'build_non_hlos') }}
        run: |
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          bash /home/dev/build_scripts/build_non_hlos.sh --build all '

      - name: Create release artifact
        if: ${{ !contains(env.SKIP_STEPS, 'create_release') }}
        run: |
          $DOCKER_EXEC "${CONTAINER_NAME}" bash -c '
          bash /home/dev/tools/container_scripts/create-artifact.sh '

      - name: Update development build state logs
        if: ${{ always() && env.BUILD_VERSION == 'development' }}
        working-directory: ${{ github.workspace }}/qualcomm_ci/scripts
        env: 
          STATUS: ${{ job.status }}
        run: |
          echo "Build status: ${STATUS}"
          echo "Development repository states: ${DEV_STATE_LOG}"
          bash log-dev-state.sh "${STATUS}" "${DEV_STATE_LOG}" "${MANIFEST_REPOSITORY}" "${MANIFEST_XML}"
          
      - name: Clean up container and image
        if: ${{ always() && !inputs.PRESERVE_DOCKER }}
        working-directory: ${{ github.workspace }}/qualcomm_ci/scripts
        run: |
          docker compose \
          -f "${GITHUB_WORKSPACE}"/qualcomm_ci/docker/docker-compose.yaml \
          down --rmi local

      - name: Preserve source files
        if: ${{ always() && inputs.PRESERVE_BUILD_DIR }}
        working-directory: ${{ github.workspace }}/qualcomm_ci/scripts
        env:
          STATUS: ${{ job.status }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: bash preserve-build.sh "${STATUS}" "${RUN_URL}" "${BRANCH}" "${ACTOR}"           
          
      - name: Clean up source files
        if:  ${{ always() && !inputs.PRESERVE_BUILD_DIR }}
        run: |
          set -euo pipefail -x
          echo "Cleaning up build source files..."

          if [ -d "${BUILD_PROJECT_DIR:?}/${QCS_SOURCES}" ]; then           
            rm -rf "${BUILD_PROJECT_DIR:?}/${QCS_SOURCES}"
          fi

          if [ -d "${BUILD_PROJECT_DIR:?}/patches" ]; then
            rm -rf "${BUILD_PROJECT_DIR:?}/patches"  
          fi


  # Cuts a GitHub release per production manifest built above, on a merge to
  # kirkstone only (development/manual-dispatch builds never produce a
  # release). Runs on the same self-hosted label as `build` because the
  # prebuilt release artifacts only exist on that box's local disk --
  # qualcomm-ci's docker-compose mounts ${CI_DIR}/builds/<name> in as the
  # container's /home/dev/Qualcomm, and imdt-build-qcom-bsp.yml never uploads
  # them as workflow artifacts. This assumes a single qcom self-hosted runner,
  # true at the time of writing (see qualcomm-ci's README).
  create-release:
    needs: [get_changed_manifests, build]
    # Real trigger is a merge to kirkstone (push); workflow_dispatch's
    # create_release checkbox exists purely so this job can be exercised
    # manually against a `list` dispatch build, for testing.
    if: ${{ needs.build.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release)) }}
    runs-on: [self-hosted, linux, x64, qcom]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get_changed_manifests.outputs.manifest_list) }}
    steps:
      # Full history + tags: needed both to find the previous release for the
      # changelog and to let action-gh-release create the new tag correctly.
      - uses: actions/checkout@v6
        with:
          path: manifest_repo
          fetch-depth: 0
          fetch-tags: true

      - name: Locate build artifacts and derive release tag
        id: locate
        if: ${{ !contains(matrix.skip_steps, 'create_release') }}
        env:
          BUILD_NAME: ${{ matrix.name }}
          RELEASE_NAME: ${{ matrix.release_name }}
          BUILD_VERSION: ${{ matrix.version }}
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_MACHINE: ${{ matrix.machine }}
          BUILD_SWU: ${{ matrix.build_swu || false }}
          # A comma(+space)-joined string, not a JSON array -- see
          # build-manifest-matrix.py -- so it's matched the same
          # substring-ish way as the `if:` above, just in bash.
          SKIP_STEPS: ${{ matrix.skip_steps }}
          # Only set (and only meaningful) on a manual test dispatch -- see
          # create_release/test_release_tag_suffix above. Empty on a real push.
          TEST_TAG_SUFFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.test_release_tag_suffix || '' }}
        run: |
          set -euo pipefail
          : "${CI_DIR:?CI_DIR is not set on this runner}"

          # The manifest key doubles as its filename stem, e.g.
          # imdt-qcom-bsp-v1.1.0 -- drop the common prefix so the tag reads
          # v1.1.0, matching the version consumers actually care about.
          TAG="${BUILD_NAME#imdt-qcom-bsp-}${TEST_TAG_SUFFIX}"

          # development manifests never reach this job: get-changed-manifests.sh
          # filters them out of manifest_list before a build is even queued, so
          # every artifact below is named per its respective script's
          # non-development branch.
          RELEASE_DIR="${CI_DIR}/builds/${BUILD_NAME}/release"
          ASSETS=()

          # Mirrors create-artifact.sh's own naming. Always produced.
          TAR="${RELEASE_DIR}/${RELEASE_NAME}_v${BUILD_VERSION}.tar.gz"
          if [ ! -f "$TAR" ]; then
            echo "::error::expected release artifact not found at $TAR"
            exit 1
          fi
          ASSETS+=("$TAR")

          # Mirrors generate-swu.sh's naming. Only produced when the manifest
          # opts into a SWUpdate image (build_swu: true).
          if [ "$BUILD_SWU" == "true" ]; then
            SWU="${RELEASE_DIR}/${BUILD_IMAGE}-swu-${BUILD_MACHINE}.swu"
            if [ ! -f "$SWU" ]; then
              echo "::error::expected SWU artifact not found at $SWU"
              exit 1
            fi
            ASSETS+=("$SWU")
          fi

          # Mirrors generate-sdk.sh's naming. Skipped when the manifest's
          # skip_steps includes build_sdk (e.g. development builds).
          if [[ "$SKIP_STEPS" != *"build_sdk"* ]]; then
            SDK="${RELEASE_DIR}/${RELEASE_NAME%_prebuilt*}-sdk-v${BUILD_VERSION}.sh"
            if [ ! -f "$SDK" ]; then
              echo "::error::expected SDK artifact not found at $SDK"
              exit 1
            fi
            ASSETS+=("$SDK")
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "assets<<ASSETS_EOF"
            printf '%s\n' "${ASSETS[@]}"
            echo "ASSETS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release assets (split any over GitHub's 2 GiB limit)
        if: steps.locate.outcome == 'success'
        env:
          ASSETS: ${{ steps.locate.outputs.assets }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/release"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # Split below GitHub's 2 GiB per-asset cap, with headroom so the
          # upload never bumps the ceiling. The SDK installer script in
          # particular routinely lands over this limit.
          CHUNK_MIB=1900
          LIMIT=$(( CHUNK_MIB * 1024 * 1024 ))

          while IFS= read -r ASSET; do
            [ -n "$ASSET" ] || continue
            NAME="$(basename "$ASSET")"
            SIZE=$(stat -c%s "$ASSET")

            if [ "$SIZE" -ge "$LIMIT" ]; then
              echo "${NAME} is ${SIZE} bytes (>= ${LIMIT}); splitting into ${CHUNK_MIB} MiB numbered parts."
              # Produces NAME.part00, .part01, ... that reassemble byte-for-byte
              # with `cat NAME.part* > NAME`.
              split --bytes="${CHUNK_MIB}M" --numeric-suffixes --suffix-length=2 "$ASSET" "${OUT}/${NAME}.part"
              echo "$(sha256sum "$ASSET" | cut -d' ' -f1)  ${NAME}" > "${OUT}/${NAME}.sha256"
              # Release notes are left for the repo owner to write (see the
              # Create GitHub release step below), so the reassembly steps for
              # this split asset are surfaced here instead, in the run summary.
              {
                echo "### Reassembling ${NAME}"
                echo ""
                echo "This file is over GitHub's 2 GiB per-file release limit, so it is"
                echo "split into numbered parts. Download every \`${NAME}.part*\` file, then:"
                echo ""
                echo '```sh'
                echo "cat ${NAME}.part* > ${NAME}"
                echo "sha256sum -c ${NAME}.sha256"
                echo '```'
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${NAME} is ${SIZE} bytes (< ${LIMIT}); uploading as a single asset."
              cp "$ASSET" "${OUT}/${NAME}"
            fi
          done <<< "$ASSETS"

          ls -lh "$OUT"

      - name: Create GitHub release
        if: steps.locate.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.locate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.locate.outputs.tag }}
          # No body/body_path: release notes are left for the repo owner to
          # write by hand. softprops/action-gh-release only touches fields it
          # is given, so a first-time release is created with an empty body,
          # and a later re-run (e.g. re-uploading assets) leaves whatever the
          # owner has since written untouched.
          files: ${{ runner.temp }}/release/*

      - name: Build release announcement
        if: steps.locate.outcome == 'success'
        id: msg
        env:
          TAG: ${{ steps.locate.outputs.tag }}
        run: |
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MSG="🚀 *New release: ${TAG}*"
          MSG="${MSG}\n"
          MSG="${MSG}\n*Repository:* ${{ github.repository }}"
          MSG="${MSG}\n*Manifest:* ${{ matrix.manifest }}"
          MSG="${MSG}\n*Commit:* ${{ github.sha }}"
          MSG="${MSG}\n*Released by:* ${{ github.actor }}"
          MSG="${MSG}\n"
          MSG="${MSG}\n<${RELEASE_URL}|View release> · <${RUN_URL}|View build>"

          echo "text=${MSG}" >> "$GITHUB_OUTPUT"

      - name: Send Slack release announcement
        if: steps.locate.outcome == 'success'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "text": "${{ steps.msg.outputs.text }}"
            }

  # Overall build result, for every triggered run (development, dispatch or
  # release). Guarded on manifest_list rather than plain always(), since most
  # schedule ticks and no-op pushes skip `build` entirely -- without the
  # guard this would post a "skipped" message to Slack on every such tick.
  notify:
    runs-on: ubuntu-latest
    needs: [get_changed_manifests, build]
    if: ${{ needs.get_changed_manifests.outputs.manifest_list != '[]' }}
    steps:
      - name: Build notification message
        id: msg
        run: |
          RESULT="${{ needs.build.result }}"
          if [ "$RESULT" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MSG="${EMOJI} *${{ github.workflow }}* — ${RESULT}"
          MSG="${MSG}\n"
          MSG="${MSG}\n*Branch:* ${{ github.ref_name }}"
          MSG="${MSG}\n*Event:* ${{ github.event_name }}"
          MSG="${MSG}\n*Commit:* ${{ github.sha }}"
          MSG="${MSG}\n*Triggered by:* ${{ github.actor }}"
          MSG="${MSG}\n"
          MSG="${MSG}\n<${RUN_URL}|View run>"

          echo "text=${MSG}" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "text": "${{ steps.msg.outputs.text }}"
            }
