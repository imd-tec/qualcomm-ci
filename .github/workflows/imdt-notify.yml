#Reusable workflow triggered by workflow_call from a manifest repo's trigger
#workflow, once per pipeline run (not matrixed), to report build status to Slack.
name: Notify build status

defaults:
  run:
    shell: bash -ueo pipefail {0}

on:
  workflow_call:
    inputs:
      BUILD_RESULT:
        required: true
        description: Result of the caller's build job (e.g. success, failure), used to pick the notification's emoji/status text
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build notification message
        id: msg
        run: |
          RESULT="${{ inputs.BUILD_RESULT }}"
          if [ "$RESULT" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MSG="${EMOJI} *${{ github.workflow }}* — ${RESULT}"
          MSG="${MSG}\n"
          MSG="${MSG}\n*Branch:* ${{ github.ref_name }}"
          MSG="${MSG}\n*Event:* ${{ github.event_name }}"
          MSG="${MSG}\n*Commit:* ${{ github.sha }}"
          MSG="${MSG}\n*Triggered by:* ${{ github.actor }}"
          MSG="${MSG}\n"
          MSG="${MSG}\n<${RUN_URL}|View run>"

          echo "text=${MSG}" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "text": "${{ steps.msg.outputs.text }}"
            }
