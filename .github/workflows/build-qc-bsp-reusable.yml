#Reusable workflow triggerd by workflow_call from external manifest repo
name: Build qcom BSP (reusable)

defaults:
  run:
    shell: bash -eo pipefail {0}

on:
    workflow_call:
        inputs:
            mani_repo:
                type: string
                required: true
            mani_branch:
                type: string
                required: true
            mani_xml:
                type: string
                required: true
            mani_name:
                type: string
                required: true
            mani_version:
                type: string
                required: true

    workflow_dispatch:

