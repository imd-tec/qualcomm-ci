#Reusable workflow triggerd by workflow_call from external manifest repo
name: Build qcom BSP (reusable)

defaults:
  run:
    shell: bash -eo pipefail {0}

on:
    workflow_call:
        inputs:
          mani_repo:
            required: true
            description: Manifest repository URL
            type: string            

          mani_branch:
            required: true
            description: Branch of manifest repository
            type: string   

          mani_xml:
            required: true
            description: Path to the manifest XML file
            type: string

          mani_name:
            required: true
            description: Name of the build
            type: string

          mani_version:
            required: true
            description: Version of the manifest
            type: string     

          mani_machine:
            required: true
            description: Build machine
            type: string      

          mani_distro:
            required: true
            description: Build distro
            type: string      
                  
          mani_image:
            required: true
            description: Build image
            type: string      

          mani_asset_path:
            required: true
            description: Path on runner to build assets (patches, etc.)
            type: string       

          mani_docker:
            required: true
            description: Docker image to use
            type: string

          mani_cdt:
            required: true
            type: string        

          mani_patches:
            required: true
            description: Whether the build has patches
            type: string

          mani_release_name:
            required: true
            description: Release artifact name
            type: string     

    workflow_dispatch:

env:
  #Build constants
  CONTAINER_NAME: "ci_qualcomm_${{ github.run_id }}"
  CI_DIR: "/mnt/nvme1/qcom_ci"
  SRC_REPO: "qcs8550-le-1-0_amss_standard_oem_apqgps"
  PYENV: "3.8.16"

  #Workflow development variables  
  BUILD_SDK: "1"
  BUILD_CDT: "0"
  FRESH_BUILD: "1"
  CLEAN_UP: "1"
  KEEP_BUILD: "1"
  DOCKER_EXEC: docker exec -t -u dev 

jobs:
  build-qualcomm-bsp:
    #specify labels to run on qcom desktop
    runs-on: [self-hosted, linux, x64, qcom]
    steps:      
      - name: Set repository workspace
        #Explicit checkout into repository. Required if triggered from external repo.
        uses: actions/checkout@v5
        with:
            repository: imd-tec/qualcomm-ci
            ref: master
            ssh-key: ${{ secrets.QCI_DEPLOY_KEY }}

      - name: Set key build variables
        run: |
          #set workflow_call inputs to shell vars
          MANI_REPO='${{ inputs.mani_repo }}'
          MANI_BRANCH='${{ inputs.mani_branch }}'
          MANI_XML='${{ inputs.mani_xml }}'
          BUILD_NAME='${{ inputs.mani_name }}'
          BUILD_VER='${{ inputs.mani_version }}'
          BUILD_MACHINE='${{ inputs.mani_machine }}'
          BUILD_DISTRO='${{ inputs.mani_distro }}'
          BUILD_IMAGE='${{ inputs.mani_image }}'
          BUILD_ASSET_PATH='${{ inputs.mani_asset_path }}'
          BUILD_DOCKER='${{ inputs.mani_docker }}'
          BUILD_CDT='${{ inputs.mani_cdt }}'
          HAS_PATCHES='${{ inputs.mani_patches }}'
          BUILD_RELEASE_NAME='${{ inputs.mani_release_name }}'

          echo "  Build Manifest:"
          echo "  Repository: $MANI_REPO"
          echo "  Branch: $MANI_BRANCH" 
          echo "  Manifest: $MANI_XML"
          echo "  Name: $BUILD_NAME"
          echo "  Version: $BUILD_VER"
          echo "  Machine: $BUILD_MACHINE"
          echo "  Distro: $BUILD_DISTRO"
          echo "  Image: $BUILD_IMAGE"
          echo "  Asset Path: $BUILD_ASSET_PATH"
          echo "  Docker: $BUILD_DOCKER"
          echo "  CDT: $BUILD_CDT"
          echo "  Has Patches: $HAS_PATCHES"
          echo "  Release Name: $BUILD_RELEASE_NAME"
          echo ""

          #store to Github environmentfor later steps
          {
            echo "MANI_REPO=$MANI_REPO"
            echo "MANI_BRANCH=$MANI_BRANCH"
            echo "MANI_XML=$MANI_XML"
            echo "BUILD_NAME=$BUILD_NAME"
            echo "BUILD_VER=$BUILD_VER"
            echo "BUILD_MACHINE=$BUILD_MACHINE"
            echo "BUILD_DISTRO=$BUILD_DISTRO"
            echo "BUILD_IMAGE=$BUILD_IMAGE"
            echo "BUILD_ASSET_PATH=$BUILD_ASSET_PATH"
            echo "BUILD_DOCKER=$BUILD_DOCKER"
            echo "BUILD_CDT=$BUILD_CDT"
            echo "HAS_PATCHES=$HAS_PATCHES"
            echo "BUILD_RELEASE_NAME=$BUILD_RELEASE_NAME"
          } >> "$GITHUB_ENV"

      - name: Extract build sources files
        if: env.FRESH_BUILD == '1'
        run: |
          set -ex

          #ensure that CI_DIR is included in asset path to avoid invalid paths
          if grep -q "${CI_DIR}" <<< "${BUILD_ASSET_PATH}"; then
            echo "Using asset path: ${BUILD_ASSET_PATH}"
          else
            echo "ERROR: Asset path ${BUILD_ASSET_PATH} is invalid. It must be under ${CI_DIR}."
            exit 1
          fi

          #create build version directory irrespective of it already existing
          mkdir -p "${BUILD_ASSET_PATH}/${BUILD_VER}/SOURCES"
          cd "${BUILD_ASSET_PATH}/${BUILD_VER}"

          #extract patches and source files
          if [ $HAS_PATCHES == 1 ]; then
              tar -xf "sources/patches/patches.tar.gz" -C .
          fi

          tar -xf "${CI_DIR}/shared_sources/${SRC_REPO}.tar.gz" -C .
          test -d "${SRC_REPO}" && test -d patches
          
