#Example build configuration file (SBC project)
defaults: &defaults #default values for all keys. Override under specific manifests as needed.
  machine: "imsu-microscope-sbc8550"
  distro: "imdt-qcom-distro-debug"
  image: "imsu-microscope-image-weston"
  kernel_variant: "consolidate"
  version: ""
  pyenv: "3.8.16"
  qcs_sources: "qcs8550-le-1-0_amss_standard_oem_apqgps"
  docker: "imdtec/imdt-qualcomm-build-setup:0.5.1"
  patch_script_path: "apps_proc/imdt-patch-qcs8550-build.sh"
  has_patches: "0"
  release_name: "imsu_microscope_prebuilt_release"
  skip_steps: []

development:
  <<: *defaults
  release_name: "imsu_microscope_development_release"

imsu-microscope-bsp-v1.1.0:
  <<: *defaults
  version: "1.1.0"
  has_patches: "1"

imsu-microscope-bsp-v1.1.1:
  <<: *defaults
  version: "1.1.1"
  has_patches: "1"

imsu-microscope-bsp-v1.2.0:
  <<: *defaults
  version: "1.2.0"
  has_patches: "1"

imsu-microscope-bsp-v1.3.0:
  <<: *defaults
  version: "1.3.0"
  has_patches: "1"
