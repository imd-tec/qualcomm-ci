# ==============================================================================
# CI QUALCOMM BUILD CONFIGURATION (build-config.yml)
# ==============================================================================
# This file determines the build parameters for each manifest version for build automation.
#
# KEY CONSIDERATIONS BEFORE EDITING:
# 1. The Key Name (e.g., 'imdt-qcom-bsp-v1.0.0') MUST match the manifest filename 
#    (e.g., 'imdt-qcom-bsp-v1.0.0.xml') exactly, excluding extension.
# 2. The versions extend from the 'defaults' key via the YAML anchor '<<: *defaults'.
#    Parameters can be overridden as needed per version.
# ==============================================================================

defaults: &defaults
  machine: "imdt-qcs8550-sbc"
  distro: "imdt-qcom-distro-debug"
  image: "imdt-image-weston"
  kernel_variant: "consolidate"
  version: ""
  pyenv: "3.8.16"
  qcs_sources: "qcs8550-le-1-0_amss_standard_oem_apqgps-r00087.1-0f7967532c0daa362217cd4e6fad847356328e0a"
  release_name: "imdt_qcs8550_sbc_prebuilt_release"
  swu_image: "false"

  # IMDT patch script path
  imdt_patch_script_path: "LE.PRODUCT.2.1.r1/apps_proc/imdt-patch-qcs8550-build.sh"

  # Docker image to use as the base for the build environment
  base_docker_image: "imdtec/imdt-qualcomm-build-setup:0.5.1"
    
  # List build steps to skip (see qualcomm-ci/.github/workflows/imdt-build-qcom-bsp.yml for further details)  
  skip_steps: []

development:
  <<: *defaults
  version: "development"

imdt-qcom-bsp-v1.1.0:
  <<: *defaults
  version: "1.1.0"
